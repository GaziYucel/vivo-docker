name: Docker Build - main

on:
  push:
    branches:
      - main
#  release:
#    types: [published]

env:
  ENV_FILE: .github/docker.env

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Load build variables
        run: |
          set -a
          source "$ENV_FILE"
          set +a

          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "DOCKERFILE=$DOCKERFILE" >> "$GITHUB_ENV"
          echo "BUILD_CONTEXT=$BUILD_CONTEXT" >> "$GITHUB_ENV"
          echo "APP_ENV=$APP_ENV" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            --file "$DOCKERFILE" \
            --build-arg APP_ENV="$APP_ENV" \
            --build-arg API_URL="$API_URL" \
            --tag "$IMAGE_NAME:${{ github.event.release.tag_name }}" \
            "$BUILD_CONTEXT"

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME:${{ github.event.release.tag_name }}"
